<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixels Forever</title>
    <!-- Pixel-perfect retro font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game-container">
        <!-- Canvas for Phaser 3 and streaming -->
        <canvas id="canvas"></canvas>
    </div>
    <div id="ui-overlay">
        <div id="header">
            <div>
                <h1>◆ PIXELS FOREVER ◆</h1>
                <p>AI-POWERED 16-BIT SITCOM</p>
            </div>
            <div id="scene-info">
                <div style="font-size: 13px;">SCENE: <span id="scene-count">00</span></div>
                <div style="font-size: 11px; color: #00aa00;" id="location-name">READY</div>
            </div>
        </div>

        <div id="location-banner">
            <h2 id="banner-title"></h2>
            <p id="banner-desc"></p>
        </div>

        <!-- Hidden element for status messages (not visible, dialogue now on canvas) -->
        <div id="dialogue-lines" style="display: none;"></div>

        <div id="controls">
            <button class="control-btn" id="playBtn">▶</button>
            <button class="control-btn" id="pauseBtn" style="display: none;">❚❚</button>
            <button class="control-btn" id="skipBtn">⏩</button>
        </div>

        <div id="status">◼ PAUSED</div>
    </div>

    <!-- Load Phaser 3 from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>

    <!-- Load configuration from server -->
    <script src="/config.js"></script>

    <!-- Load Phaser configuration and constants -->
    <script src="phaser-config.js"></script>

    <!-- Load scenes -->
    <script src="scenes/BootScene.js"></script>
    <script src="scenes/GameScene.js"></script>

    <!-- Load entities (Phase 3) -->
    <script src="entities/Character.js"></script>

    <!-- Load managers (Phases 3-7) -->
    <script src="managers/AudioManager.js"></script>
    <script src="managers/CharacterManager.js"></script>
    <script src="managers/SceneManager.js"></script>
    <!-- <script src="managers/LocationManager.js"></script> -->

    <!-- Load UI components (Phase 6) -->
    <script src="ui/DialogueBox.js"></script>

    <!-- Initialize Phaser (must be last) -->
    <script src="main.js"></script>
</body>
</html>
